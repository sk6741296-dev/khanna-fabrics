  <path d="M22 42 C16 34, 18 22, 28 20 C36 18, 44 24, 42 32 C40 38, 32 40, 24 35" fill="none" stroke="#C59B27" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 3"/>
