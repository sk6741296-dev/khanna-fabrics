<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#B35446"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#C59B27" stroke-width="1.2" stroke-opacity="0.6"/>
  
  <!-- Stylized Textile Needle & Golden Thread Loop -->
