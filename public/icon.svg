    <path d="M0 0 C-6 -3, -11 -2, -13 0 C-11 2, -6 3, 0 0" fill="#FAF8F5" opacity="0.9" transform="rotate(72)"/>
    <path d="M0 0 C-6 -3, -11 -2, -13 0 C-11 2, -6 3, 0 0" fill="#FAF8F5" opacity="0.9" transform="rotate(144)"/>
    <path d="M0 0 C-6 -3, -11 -2, -13 0 C-11 2, -6 3, 0 0" fill="#FAF8F5" opacity="0.9" transform="rotate(216)"/>
    <path d="M0 0 C-6 -3, -11 -2, -13 0 C-11 2, -6 3, 0 0" fill="#FAF8F5" opacity="0.9" transform="rotate(288)"/>
